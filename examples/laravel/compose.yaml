name: pesapal-laravel-example

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        PHP_VERSION: '${PHP_VERSION:-8.3}'

    working_dir: /workspace/examples/laravel

    volumes:
      - ../..:/workspace

      - laravel-vendor:/workspace/examples/laravel/vendor

      - composer-cache:/tmp/composer-cache

    environment:
      COMPOSER_ALLOW_SUPERUSER: '1'
      COMPOSER_CACHE_DIR: /tmp/composer-cache
      COMPOSER_PROCESS_TIMEOUT: '1200'

    depends_on:
      pgsql:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          php -r '$$s=@fsockopen("127.0.0.1",9000); exit($$s ? 0 : 1);'

      interval: 3s
      timeout: 3s
      retries: 120
      start_period: 20s

    restart: unless-stopped

    networks:
      - example


  nginx:
    image: nginx:1.27-alpine

    ports:
      - "8009:80"
      - "8443:443"

    volumes:
      - ../..:/workspace:ro

      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

      - certbot-www:/var/www/certbot:ro

      - certbot-conf:/etc/letsencrypt:ro

    depends_on:
      app:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - example


  pgsql:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: ${DB_DATABASE:-pesapal_example}
      POSTGRES_USER: ${DB_USERNAME:-pesapal}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}

    volumes:
      - pgsql-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${DB_USERNAME:-pesapal} -d ${DB_DATABASE:-pesapal_example}

      interval: 3s
      timeout: 3s
      retries: 30

    restart: unless-stopped

    networks:
      - example


  certbot:
    image: certbot/certbot:latest

    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt

    profiles:
      - certbot


networks:
  example:
    driver: bridge


volumes:
  pgsql-data:

  laravel-vendor:

  composer-cache:

  certbot-www:

  certbot-conf: