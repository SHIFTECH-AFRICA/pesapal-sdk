name: pesapal-laravel-example

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        PHP_VERSION: '${PHP_VERSION:-8.3}'
    working_dir: /workspace/examples/laravel
    volumes:
      # The whole repository is mounted because the demo consumes the SDK from ../..
      - ../..:/workspace

      # Keep Composer's heavy vendor tree inside Docker's Linux filesystem.
      # This avoids very slow archive extraction over Docker Desktop's Windows bind mount.
      - laravel-vendor:/workspace/examples/laravel/vendor

      # Persist Composer downloads between rebuilds/restarts.
      - composer-cache:/tmp/composer-cache
    environment:
      COMPOSER_ALLOW_SUPERUSER: '1'
      COMPOSER_CACHE_DIR: /tmp/composer-cache
      COMPOSER_PROCESS_TIMEOUT: '1200'
    depends_on:
      pgsql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          php -r '$$s=@fsockopen("127.0.0.1",9000); exit($$s ? 0 : 1);'
      interval: 3s
      timeout: 3s
      retries: 120
      start_period: 20s
    networks:
      - example

  nginx:
    image: nginx:1.27-alpine
    # No fixed Windows host port. Docker chooses an available ephemeral port.
    # Discover it with: docker compose port nginx 80
    ports:
      - '80'
    volumes:
      - ../..:/workspace:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - example

  pgsql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pesapal_example
      POSTGRES_USER: pesapal
      POSTGRES_PASSWORD: secret
    volumes:
      - pgsql-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pesapal -d pesapal_example']
      interval: 3s
      timeout: 3s
      retries: 30
    networks:
      - example

networks:
  example:
    driver: bridge

volumes:
  pgsql-data:
  laravel-vendor:
  composer-cache:
