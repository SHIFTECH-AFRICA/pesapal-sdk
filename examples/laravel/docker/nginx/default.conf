
server {
    listen 80;
    listen [::]:80;

    server_name pesapal.shiftechafrica.com;

    # Keep Let's Encrypt challenge reachable for renewals (optional)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    root /workspace/examples/laravel/public;
    index index.php;

    charset utf-8;

    client_max_body_size 20M;

    # Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # PHP / Laravel front controller (HTTP)
    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        fastcgi_param HTTPS off;
        fastcgi_param SERVER_PORT 80;

        fastcgi_param HTTP_X_FORWARDED_PROTO http;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PORT 80;

        include fastcgi_params;

        fastcgi_hide_header X-Powered-By;
    }

    # Do not execute arbitrary PHP files
    location ~ \.php$ {
        return 404;
    }

    # Block hidden files except .well-known
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
