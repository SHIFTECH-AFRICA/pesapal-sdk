server {
    listen 80;
    listen [::]:80;

    server_name pesapal.shiftechafrica.com;

    # Keep Let's Encrypt challenge reachable for renewals
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Redirect normal HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}


server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name pesapal.shiftechafrica.com;

    ssl_certificate /etc/letsencrypt/live/pesapal.shiftechafrica.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pesapal.shiftechafrica.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /workspace/examples/laravel/public;
    index index.php;

    charset utf-8;

    client_max_body_size 20M;


    # Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }


    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }


    location = /robots.txt {
        access_log off;
        log_not_found off;
    }


    # PHP / Laravel front controller
    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # Laravel must know the request is HTTPS
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;

        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PORT 443;

        include fastcgi_params;

        fastcgi_hide_header X-Powered-By;
    }


    # Do not execute arbitrary PHP files
    location ~ \.php$ {
        return 404;
    }


    # Block hidden files except .well-known
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
